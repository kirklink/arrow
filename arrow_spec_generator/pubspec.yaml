name: arrow_spec_generator
description: Generate OpenAPI 3.0 specifications from Arrow framework code with annotations
version: 0.1.0
homepage: "https://github.com/kirklink/arrow"
publish_to: none

environment:
  sdk: '>=2.12.0 <4.0.0'

dependencies:
  # Core Arrow framework (for annotations)
  arrow:
    path: ../

  # Code generation
  build: ^2.4.0
  source_gen: ^1.5.0
  analyzer: ^6.0.0

  # Utilities
  path: ^1.8.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.25.0
