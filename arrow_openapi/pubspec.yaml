name: arrow_openapi
description: OpenAPI 3.0 code generator for Arrow framework. Generate Arrow routers and handlers from OpenAPI specifications.
version: 0.1.0
homepage: "https://github.com/kirklink/arrow"
publish_to: none

environment:
  sdk: '>=2.12.0 <4.0.0'

dependencies:
  # Core Arrow framework
  arrow:
    path: ../

  # Code generation
  build: ^2.4.0
  source_gen: ^1.5.0
  analyzer: ^6.0.0

  # Utilities
  path: ^1.8.0
  yaml: ^3.1.0

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.25.0
